[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexiqode-core"
version = "1.0.0"
description = "LexiQode core: an OpenAI-compatible coding agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lexiqode = "lexiqode.cli:main"

[tool.setuptools.packages.find]
include = ["lexiqode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"