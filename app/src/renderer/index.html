<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      No remote anything. `connect-src 'none'` is the load-bearing part: the
      window has no way to reach the network, so the model endpoint is only ever
      contacted by the main process. `unsafe-eval` is required by Monaco's AMD
      loader, which compiles its module definitions with the Function
      constructor; every script it loads comes from this application's own
      vendor directory.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; worker-src 'self' blob:; child-src 'self' blob:;"
    />
    <title>LexiQode</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="titlebar" id="titlebar">
        <div class="titlebar__drag">
          <span class="titlebar__logo" id="brand">LexiQode</span>
          <!--
            The open folder, in the title bar, as a button.

            It is the one thing a user needs constantly and the window had no
            visible way to do it: the menu is inside the native title bar area,
            so the only routes were a status bar item and a keyboard chord. This
            shows which folder is open and opens another one on a click.
          -->
          <button class="titlebar__folder" id="titlebar-folder" type="button"></button>
          <nav class="titlebar__menus" id="menubar"></nav>
        </div>
        <!--
          Nothing on the right of the title bar: with a hidden title bar the
          native window buttons are drawn there, and anything placed next to them
          ends up underneath them. The agent's state is shown where it belongs,
          in the assistant's own header and in the status bar.
        -->
      </header>

      <div class="body">
        <nav class="activity" id="activity" aria-label="Views"></nav>

        <aside class="sidebar" id="sidebar">
          <div class="pane__head">
            <span class="pane__title" id="sidebar-title" data-i18n="view.explorer">Explorer</span>
            <div class="pane__actions" id="sidebar-actions"></div>
          </div>
          <div class="pane__body" id="sidebar-body"></div>
          <div class="resizer resizer--v" id="sidebar-resizer" role="separator" aria-orientation="vertical"></div>
        </aside>

        <main class="main">
          <div class="tabs" id="tabs"></div>
          <div class="editor" id="editor"></div>
          <section class="welcome" id="welcome"></section>

          <section class="panel" id="panel">
            <div class="resizer resizer--h" id="panel-resizer" role="separator" aria-orientation="horizontal"></div>
            <div class="pane__head">
              <div class="panel__tabs" id="panel-tabs"></div>
              <div class="pane__actions" id="panel-actions"></div>
            </div>
            <div class="pane__body pane__body--flush" id="panel-body"></div>
          </section>
        </main>

        <aside class="chat" id="chat">
          <div class="resizer resizer--v" id="chat-resizer" role="separator" aria-orientation="vertical"></div>
          <div class="pane__head">
            <span class="pane__title" data-i18n="chat.title">Assistant</span>
            <span class="dot" id="chat-dot" data-state="off"></span>
            <span class="chat__state" id="chat-state" data-state="off"></span>
            <div class="pane__actions" id="chat-actions"></div>
          </div>
          <!-- One tab per open chat. The chats themselves live in the core; this
               strip only says which of them are open. -->
          <div class="chattabs" id="chat-tabs" role="tablist"></div>
          <div class="transcript" id="transcript"></div>
          <div class="composer" id="composer">
            <div class="composer__context" id="composer-context"></div>
            <textarea
              id="composer-input"
              class="composer__input"
              rows="1"
              data-i18n-placeholder="chat.placeholder"
              placeholder="Ask, plan, debug or hand over a task…"
              spellcheck="false"
            ></textarea>
            <div class="composer__row">
              <div class="modes" id="composer-modes"></div>
              <!--
                The model, beside the mode.

                Both decide what the next message does, so they belong together,
                next to the field: the mode says what the agent may do and the
                model says who does it. Until now the only place to change the
                model was the settings sheet, and the status bar only reported it.
              -->
              <div class="modelhost" id="composer-model"></div>
              <div class="composer__spacer"></div>
              <button class="btn btn--ghost" id="composer-stop" type="button" data-i18n="chat.stop" hidden>Stop</button>
              <button class="btn btn--primary" id="composer-send" type="button" data-i18n="chat.send">Send</button>
            </div>
          </div>
        </aside>
      </div>

      <footer class="statusbar" id="statusbar"></footer>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="palette" role="dialog" aria-modal="true">
        <input id="palette-input" class="palette__input" type="text" spellcheck="false" autocomplete="off" />
        <div class="palette__list" id="palette-list"></div>
        <div class="palette__hint" id="palette-hint"></div>
      </div>
    </div>

    <!--
      The window's own settings.

      The assistant's sheet in the chat panel is about the agent - an endpoint, a
      key, a model. This one is about the window: how it looks, what the editor
      does, which folders are skipped, where the terminal starts, and whether a
      newer release is looked for at all.
    -->
    <div class="overlay" id="settings-overlay" hidden>
      <div class="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings__head">
          <span class="settings__title" id="settings-title" data-i18n="settings.appTitle">Settings</span>
          <div class="settings__head-actions" id="settings-head-actions"></div>
        </div>
        <div class="settings__body" id="settings-body"></div>
      </div>
    </div>

    <!--
      A new release, offered.

      The update is downloaded and installed by the main process, which is also
      where the swap script is written: the window only ever says what it wants
      to happen.
    -->
    <div class="overlay" id="update-overlay" hidden>
      <div class="settings settings--narrow" role="dialog" aria-modal="true" aria-labelledby="update-title">
        <div class="settings__head">
          <span class="settings__title" id="update-title" data-i18n="update.title">An update is available</span>
          <div class="settings__head-actions" id="update-head-actions"></div>
        </div>
        <div class="settings__body" id="update-body"></div>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>

    <!--
      xterm is loaded as a classic script before the module entry point: it is
      the terminal renderer, it has no module build in the vendored copy, and it
      must exist before the terminal panel's code runs.
    -->
    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/xterm/addon-fit.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
