name: Build the IDE

# The IDE is a patched build of the VS Code sources, and that build needs the
# Microsoft C++ toolchain. A workstation without administrator rights cannot
# install it, so the build happens here instead: the runner image ships Visual
# Studio Enterprise 2022 with the NativeDesktop workload, VC.Tools.x86.x64 and
# the Windows 11 SDK, which is exactly what the sources require.
#
# The result is a portable folder. Running it needs no privileges and no
# installation, so the artifact is usable on the restricted machine as is.

on:
  workflow_dispatch:
    inputs:
      vscode_ref:
        description: 'VS Code source ref to build (a real tag, or main)'
        required: true
        # Must be a tag that exists upstream. 1.144.0 is the version on main and
        # has no tag, which is what made the first run fail at the clone.
        default: '1.142.0'
  push:
    branches: [main]
    paths:
      # Only the inputs that change the product itself. Changes to the extension
      # or the core are covered by the local test suites, and each run here costs
      # Windows minutes at double rate on a private repository, so a new agent
      # build is asked for deliberately.
      - 'ide/**'
      - 'scripts/build-ide.ps1'
      - '.github/workflows/build-ide.yml'

env:
  # Paths are derived from the runner, never hardcoded: a runner has no
  # C:\lexiqode, and a build that only works on one machine is not a build.
  VSCODE_SOURCE: ${{ runner.temp }}\vscode
  IDE_BUILD: ${{ runner.temp }}\VSCode-win32-x64

jobs:
  build:
    # Visual Studio 2022 with the C++ workload and the Windows 11 SDK.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Report the toolchain the runner provides
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $path) {
            throw "the runner has no Visual Studio with the C++ workload; the build cannot proceed"
          }
          Write-Host "Visual Studio: $path"

      - name: Set up Node from the source requirements
        uses: actions/setup-node@v7
        with:
          node-version-file: 'ide/vscode-node-version.txt'

      - name: Check out the VS Code sources
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.vscode_ref }}"
          if (-not $ref) { $ref = '1.142.0' }
          Write-Host "cloning microsoft/vscode at $ref"
          git clone --depth 1 --branch $ref https://github.com/microsoft/vscode.git $env:VSCODE_SOURCE
          if (-not (Test-Path "$env:VSCODE_SOURCE\package.json")) {
            throw "the clone produced no package.json at $env:VSCODE_SOURCE"
          }
          # Record what was built, so an artifact can be traced to a commit.
          Push-Location $env:VSCODE_SOURCE
          try {
            Write-Host "source commit: $(git rev-parse HEAD)"
            Write-Host "source version: $((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          } finally {
            Pop-Location
          }
          # The sources pin their own Node version; report a mismatch rather than
          # discovering it as a native module failure later.
          $wanted = (Get-Content "$env:VSCODE_SOURCE\.nvmrc" -Raw).Trim()
          $have = (node -v).TrimStart('v')
          Write-Host "source wants node $wanted, runner has $have"
          if ($wanted -and $have -ne $wanted) {
            # Not fatal: the native modules simply get built for the running
            # version, which is fine for our own build. Reported, not hidden.
            Write-Warning "building with node $have while the sources ask for $wanted"
          }

      - name: Compile the extension
        working-directory: extension
        run: |
          npm install --no-audit --no-fund
          npm run compile

      - name: Build the IDE
        shell: pwsh
        run: ./scripts/build-ide.ps1 -Source $env:VSCODE_SOURCE

      - name: Report what was built
        shell: pwsh
        run: |
          $built = $env:IDE_BUILD
          if (-not (Test-Path $built)) { throw "no build at $built" }
          $product = Get-Content "$built\resources\app\product.json" -Raw | ConvertFrom-Json
          Write-Host "identity:  $($product.nameLong)"
          Write-Host "profile:   $($product.dataFolderName)"
          Write-Host "gallery:   $($product.extensionsGallery.serviceUrl)"
          Write-Host "telemetry: $($product.enableTelemetry)"
          $size = [int]((Get-ChildItem $built -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host "size:      $size MB"

      # Reporting above is for a human reading the log. This step is what decides
      # whether the artifact may be published, and it inspects the packaged files
      # rather than trusting the steps that produced them.
      - name: Verify the packaged build against the branding rules
        shell: pwsh
        run: |
          if (-not (Get-Command python -ErrorAction SilentlyContinue)) {
            Write-Warning 'python is unavailable on this runner; the branding rule set was not checked'
            return
          }
          python scripts/check_branding.py --built "$env:IDE_BUILD\resources\app\product.json"
          if ($LASTEXITCODE -ne 0) { throw 'the packaged build does not carry our identity' }

      - name: Upload the IDE
        uses: actions/upload-artifact@v7
        with:
          name: LexiQode-win32-x64
          path: ${{ env.IDE_BUILD }}
          # Long builds produce many files; the compression is worth the time.
          compression-level: 6
          # A packaged build is a few hundred megabytes and artifact storage on a
          # private repository is limited, so it is not kept for long: download it
          # after the run rather than relying on it sitting there.
          retention-days: 7