name: app

# Manual only, deliberately. This ran on every push, which meant a failing run and
# a notification for work that had already been tested on the machine it was
# written on. The two suites are two commands locally:
#
#     cd core;  python -m pytest tests -q
#     cd app;   npm test
#
# Run this workflow from the Actions tab when a build artifact is actually
# wanted. Deleting the file turns it off completely.
on:
  workflow_dispatch:

jobs:
  verify:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the core
        working-directory: core
        run: pip install -r requirements.txt pytest
      - name: Core tests
        working-directory: core
        run: python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the app's dependencies
        working-directory: app
        env:
          # The test suite needs the packages, not the Electron binary; skipping
          # the download saves about a hundred megabytes on every run.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: App tests
        working-directory: app
        run: npm test

  package:
    name: portable bundle
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the app's dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Fetch the Electron binary
        working-directory: app
        run: node node_modules/electron/install.js

      - name: Build the bundle and the zip
        shell: pwsh
        run: ./scripts/build-app.ps1 -SkipTests

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: LexiQode-win32-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

      # Optional: a repository that sets GITEA_SERVER, GITEA_OWNER and
      # GITEA_TOKEN gets its builds published; one that does not still gets a
      # verified artifact. Nothing here fails a build for a missing secret.
      - name: Publish to the Gitea package registry
        if: ${{ secrets.GITEA_TOKEN != '' && vars.GITEA_SERVER != '' }}
        shell: pwsh
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_OWNER: ${{ secrets.GITEA_OWNER }}
        run: |
          ./scripts/publish-gitea.ps1 -Server "${{ vars.GITEA_SERVER }}" -Owner $env:GITEA_OWNER